services:
  - type: web
    name: math-platform-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/db/seed.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
